name: 🚀 Publish Package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 🗂️  Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️  Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Dev deps are needed: build:validator imports esbuild. --ignore-scripts keeps
      # the package's own postinstall from writing into the runner's ~/.claude.
      - name: 🧩  Install dependencies
        run: npm ci --ignore-scripts

      - name: 🏷️  Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME ≠ package.json $v"; exit 1; }

      # All eight suites: schemas, kernel lock, doc-drift lint, hooks, factory gates, CLIs, reporter, agents.
      - name: ✅  Suites (npm test)
        run: npm test

      - name: 📦  Tarball contents
        run: node scripts/check-pack.mjs

      # --ignore-scripts: prepack would re-run the suites.
      - name: 🚀  Publish
        run: npm publish --ignore-scripts --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
