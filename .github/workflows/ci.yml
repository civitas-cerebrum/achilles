name: ✅ CI

# Every suite the package owns, as separate steps, on Linux and macOS with Node 20 and 24.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🗂️  Checkout
        uses: actions/checkout@v4

      - name: ⚙️  Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # --ignore-scripts skips the package's own postinstall (Chromium fetch, Claude Code
      # registration); the own-checkout guard would skip it anyway.
      - name: 🧩  Install dependencies
        id: install
        run: npm ci --ignore-scripts

      # One step per suite; each runs even when an earlier one fails, so one push reports
      # all breakage. The list matches scripts/run-suites.mjs (`npm test`).
      - name: 🔎  Schemas
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run schemas:lint

      - name: 📐  Doc-drift lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run test:lint

      - name: 🛠️  CLI and install tests
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run test:bin

      - name: 📊  Reporter tests
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run test:reporter

      # The adapter's Node half always runs; `claude plugin validate` and `claude plugin test`
      # run where the Claude Code CLI is installed (the step below) and are skipped elsewhere.
      - name: 🔌  Claude Code CLI
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm install -g @anthropic-ai/claude-code && claude --version
        continue-on-error: true

      - name: 🧪  Adapter tests
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run test:adapter

      - name: 📦  Tarball contents
        if: ${{ !cancelled() && steps.install.conclusion == 'success' && matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        run: node scripts/check-pack.mjs
