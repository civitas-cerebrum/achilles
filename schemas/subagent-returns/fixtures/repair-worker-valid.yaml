handover:
  role: repair-worker-tests-e2e-checkout-spec-ts
  cycle: 1
  status: completed
  next-action: deregister; report written to .achilles/self-repair/run/workers/checkout.report.json
file: tests/e2e/checkout.spec.ts
tests:
  - title: completes checkout with saved card
    outcome: healed
    baseline-pattern: deterministic-fail
    root-cause: selector drift — `submit-btn` renamed to `place-order-btn` in the app
    understanding: >
      Expected: clicking the order button submits checkout. Actual: the click
      never resolved because the button's test id changed in the app; the
      renamed element matches passing sibling flows, and re-learning the
      selector restores the journey (confirmed by experiment before healing).
    fix: updated CheckoutPage.submit-button entry in page-repository.json
    stability-runs:
      passed: 5
      total: 5
  - title: rejects expired card with inline error
    outcome: app-bug
    baseline-pattern: deterministic-fail
    root-cause: app returns 500 on expired-card submission instead of inline validation
    understanding: >
      Out-of-harness reproduction fails identically; varying harness factors
      changes nothing — the 500 is server-side, not test-side.
    bug-report:
      summary: POST /api/checkout 500s on expired card; UI shows blank error region
      expected-behaviour: Submitting an expired card shows the inline "card expired" validation message; no order is created.
      actual-behaviour: POST /api/checkout returns 500 and the error region renders blank; reproduced in and out of the harness.
      confidence: high
      evidence:
        - bug-evidence/TC_CHECKOUT_012/20260805T120000Z-worker-capture/checkout-expired-card.png
        - bug-evidence/TC_CHECKOUT_012/20260805T120000Z-worker-capture/trace.zip
        - bug-evidence/TC_CHECKOUT_012/20260805T121500Z-slowmo-repro/video.webm
  - title: registering an already-used email surfaces a conflict
    outcome: healed
    baseline-pattern: known-defect-passed
    root-cause: the filed defect was fixed upstream; the @known-defect tag no longer told the truth
    understanding: >
      A pass under @known-defect is an anomaly, never a silent green
      (test-identity.md §2). The stability probe ran 3/3 targeted plus 5/5
      suite-order green, so the defect is fixed: the tag came off and
      nothing else changed.
    fix: removed the @known-defect tag after the stability bar; assertions untouched
    stability-runs:
      passed: 8
      total: 8
